[package]
name = "msbjit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native Cranelift JIT and decoupled runtime for Scratch 3 projects"
license = "MIT"

[features]
default = []
streaming = ["dep:axum", "dep:bytes", "dep:futures-util", "dep:tokio", "dep:webrtc", "dep:wgpu", "dep:bytemuck", "dep:image", "dep:resvg"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cranelift-codegen = "0.128"
cranelift-frontend = "0.128"
cranelift-jit = "0.128"
cranelift-module = "0.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
resvg = { version = "0.45", default-features = false, optional = true }
ctrlc = "3"
axum = { version = "0.8", features = ["ws"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"], optional = true }
webrtc = { version = "0.14", optional = true }
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tokio-tungstenite = "0.29"
