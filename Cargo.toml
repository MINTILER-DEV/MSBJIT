[package]
name = "msbjit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native Cranelift JIT and decoupled runtime for Scratch 3 projects"
license = "MIT"

[features]
default = ["desktop"]
graphics = ["dep:wgpu", "dep:bytemuck", "dep:image", "dep:resvg", "dep:fontdue"]
desktop = ["graphics", "dep:minifb", "dep:pollster"]
streaming = ["graphics", "dep:axum", "dep:bytes", "dep:futures-util", "dep:tokio", "dep:webrtc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cranelift-codegen = "0.128"
cranelift-frontend = "0.128"
cranelift-jit = "0.128"
cranelift-module = "0.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
resvg = { version = "0.45", default-features = false, features = ["text"], optional = true }
ctrlc = "3"
minifb = { version = "0.28", optional = true }
pollster = { version = "0.4", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"], optional = true }
webrtc = { version = "0.14", optional = true }
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
fontdue = { version = "0.9", optional = true }
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
pollster = "0.4"
tokio-tungstenite = "0.29"
